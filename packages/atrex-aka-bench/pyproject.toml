[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-bench"
version = "0.1.0"
description = "AKA task problem loading and legacy input validation"
requires-python = ">=3.10"
dependencies = ["atrex-aka-core==0.1.0", "atrex-aka-contracts==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.legacy.task.problem", "aka.legacy.task.problem.*"]

[tool.setuptools.package-data]
"aka.legacy.task.problem" = ["profiles/*.json", "profiles/bundles/*.json"]

[project.entry-points."aka.tokens"]
problem = "aka.legacy.task.problem.plugin:PROBLEM"
