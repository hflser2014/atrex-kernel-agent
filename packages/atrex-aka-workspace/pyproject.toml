[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-workspace"
version = "0.1.0"
description = "AKA initial sources and legacy candidate workspace operations"
requires-python = ">=3.10"
dependencies = ["atrex-aka-core==0.1.0", "atrex-aka-contracts==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.task", "aka.task.source", "aka.task.source.*", "aka.task.candidate_workspace", "aka.task.candidate_workspace.*"]

[tool.setuptools.package-data]
"aka.task.source" = ["profiles/*.json", "profiles/bundles/*.json"]
"aka.task.candidate_workspace" = ["profiles/*.json", "profiles/bundles/*.json", "*.sh"]
