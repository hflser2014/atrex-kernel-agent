[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-optimization"
version = "0.1.0"
description = "AKA plugin framework: optimization"
requires-python = ">=3.10"
dependencies = ["atrex-aka-core==0.1.0", "atrex-aka-contracts==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.bootstrap", "aka.bootstrap.*"]

[tool.setuptools.package-data]
"aka.bootstrap" = ["profiles/*.json", "profiles/bundles/*.json"]
