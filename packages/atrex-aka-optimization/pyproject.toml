[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-optimization"
version = "0.1.0"
description = "AKA optimization Application with explicit dependencies"
requires-python = ">=3.10"
dependencies = ["atrex-aka-contracts==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.application", "aka.application.*"]
